plugins {
    id 'com.android.application'
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

def enableKokoroViStage1 = project.hasProperty('kokoroViStage1') &&
        project.property('kokoroViStage1').toString().toBoolean()

// CI builds get a monotonically increasing code so a stable-signed APK can update in place.
// A private signing key is NEVER stored in this public repository. When the four VOX_SIGNING_*
// environment variables are present Gradle uses that stable key; otherwise CI falls back to its
// disposable debug key for verification and the artifact can be re-signed outside the repository.
def explicitVersionCode = System.getenv('VOX_VERSION_CODE')
def githubRunNumber = System.getenv('GITHUB_RUN_NUMBER')
def resolvedVersionCode = explicitVersionCode ? explicitVersionCode.toInteger() :
        (githubRunNumber ? 100000 + githubRunNumber.toInteger() : 24)
def explicitVersionName = System.getenv('VOX_VERSION_NAME')
def resolvedVersionName = explicitVersionName ?: '4.1.1'
def stableStorePath = System.getenv('VOX_SIGNING_STORE_FILE')
def stableStorePassword = System.getenv('VOX_SIGNING_STORE_PASSWORD')
def stableKeyAlias = System.getenv('VOX_SIGNING_KEY_ALIAS')
def stableKeyPassword = System.getenv('VOX_SIGNING_KEY_PASSWORD')
def hasStableSigning = stableStorePath && stableStorePassword && stableKeyAlias && stableKeyPassword

android {
    compileSdk 34

    useLibrary 'org.apache.http.legacy'

    defaultConfig {
        applicationId "com.CodeBySonu.VoxSherpa"
        namespace "com.CodeBySonu.VoxSherpa"
        minSdkVersion 30
        targetSdkVersion 36
        versionCode resolvedVersionCode
        versionName resolvedVersionName

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }

        if (enableKokoroViStage1) {
            externalNativeBuild {
                cmake {
                    cppFlags '-std=c++17'
                }
            }
        }
    }

    signingConfigs {
        if (hasStableSigning) {
            stableRelease {
                storeFile file(stableStorePath)
                storePassword stableStorePassword
                keyAlias stableKeyAlias
                keyPassword stableKeyPassword
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig hasStableSigning ? signingConfigs.stableRelease : signingConfigs.debug

            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
        pickFirst '**/*.so'
    }

    androidResources {
        noCompress += ['onnx', 'bin', 'f32le']
    }

    if (enableKokoroViStage1) {
        externalNativeBuild {
            cmake {
                path file('src/main/cpp/kokoro_vi/CMakeLists.txt')
                version '3.22.1'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'com.squareup.okhttp3:okhttp:5.0.0-alpha.14'
    implementation 'com.squareup.okio:okio-jvm:3.9.0'

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation platform('com.google.firebase:firebase-bom:34.1.0')
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.github.k2-fsa:sherpa-onnx:1.12.26'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.google.code.gson:gson:2.11.0'
}
