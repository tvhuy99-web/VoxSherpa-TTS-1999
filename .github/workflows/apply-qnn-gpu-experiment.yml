name: Apply QNN GPU Experiment Patch

on:
  push:
    branches:
      - agent/qnn-gpu-experiment

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: agent/qnn-gpu-experiment
          fetch-depth: 0

      - name: Apply source patch
        run: python3 scripts/apply_qnn_gpu_experiment.py

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/CodeBySonu/VoxSherpa/vietnamese/VietnameseKokoroEngine.java \
                  app/src/main/cpp/kokoro_vi/kokoro_vi_jni.cpp
          if git diff --cached --quiet; then
            echo "No source changes were needed."
            exit 0
          fi
          git commit -m "Add QNN GPU provider experiment"
          git push origin HEAD:agent/qnn-gpu-experiment
