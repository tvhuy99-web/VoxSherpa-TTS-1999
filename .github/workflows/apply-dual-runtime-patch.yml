name: Apply dual runtime patch

on:
  push:
    branches:
      - agent/qnn-gpu-experiment

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply dual ORT 1.26 runtime selector'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/qnn-gpu-experiment
          fetch-depth: 0

      - name: Patch engine and diagnostics UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          engine_path = Path('app/src/main/java/com/CodeBySonu/VoxSherpa/vietnamese/VietnameseKokoroEngine.java')
          s = engine_path.read_text()

          old = '    private static final String PREF_NNAPI_ENABLED = "nnapi_enabled";\n'
          new = old + '    private static final String PREF_RUNTIME_BACKEND = "runtime_backend";\n    public static final String BACKEND_CPU = "CPU";\n    public static final String BACKEND_QNN_GPU = "QNN_GPU";\n'
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    public boolean isQnnGpuActive() {\n        return activeQnnGpu;\n    }\n\n    private String activeProviderLabel() {\n'''
          new = '''    public boolean isQnnGpuActive() {\n        return activeQnnGpu;\n    }\n\n    public boolean isDualRuntimeBuild() {\n        return BuildConfig.KOKORO_QNN_GPU_DEFAULT;\n    }\n\n    public String requestedRuntimeBackend(Context context) {\n        if (!BuildConfig.KOKORO_QNN_GPU_DEFAULT || context == null) return BACKEND_CPU;\n        String saved = context.getSharedPreferences(PERF_PREFS, Context.MODE_PRIVATE)\n                .getString(PREF_RUNTIME_BACKEND, BACKEND_CPU);\n        return BACKEND_QNN_GPU.equals(saved) ? BACKEND_QNN_GPU : BACKEND_CPU;\n    }\n\n    public boolean isQnnGpuRequested(Context context) {\n        return BuildConfig.KOKORO_QNN_GPU_DEFAULT\n                && BACKEND_QNN_GPU.equals(requestedRuntimeBackend(context));\n    }\n\n    public synchronized String setRuntimeBackend(Context context, String backend) throws Exception {\n        if (context == null) throw new IllegalArgumentException("Context is required.");\n        Context app = context.getApplicationContext();\n        appContext = app;\n        String requested = BACKEND_QNN_GPU.equals(backend) ? BACKEND_QNN_GPU : BACKEND_CPU;\n        if (BACKEND_QNN_GPU.equals(requested) && !BuildConfig.KOKORO_QNN_GPU_DEFAULT) {\n            throw new IllegalStateException("QNN GPU runtime is not packaged in this build.");\n        }\n\n        SharedPreferences prefs = app.getSharedPreferences(PERF_PREFS, Context.MODE_PRIVATE);\n        prefs.edit()\n                .putString(PREF_RUNTIME_BACKEND, requested)\n                .putInt(PREF_CPU_THREADS, 0)\n                .putBoolean(PREF_NNAPI_ENABLED, false)\n                .apply();\n\n        long started = System.nanoTime();\n        TtsDiagnostics.info(app, "provider", "backend_switch_start",\n                "requestedBackend=" + requested + ", forcingCpuThreads=ORT-default");\n        cancel();\n        if (modelReady) nativeBridge.destroyEngine();\n        modelReady = false;\n        modelWarm = false;\n        activeNnapi = false;\n        activeQnnGpu = false;\n        activeCpuThreads = 0;\n\n        prepare(app);\n        if (!modelWarm && !warmCurrentSession(app, "runtime_backend_switch:" + requested)) {\n            throw new IllegalStateException("Vietnamese Kokoro runtime switch warm-up was interrupted.");\n        }\n\n        String active = activeProviderLabel();\n        TtsDiagnostics.info(app, "provider", "backend_switch_complete",\n                "requestedBackend=" + requested + ", activeProvider=" + active\n                        + ", elapsedMs=" + elapsedMs(started) + ", " + performanceState(app));\n        return active;\n    }\n\n    private String activeProviderLabel() {\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '                    + ", qnnGpuBuild=" + BuildConfig.KOKORO_QNN_GPU_DEFAULT\n'
          new = '                    + ", requestedBackend=" + requestedRuntimeBackend(context)\n                    + ", qnnGpuBuild=" + BuildConfig.KOKORO_QNN_GPU_DEFAULT\n'
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        boolean restoreAccelerator = BuildConfig.KOKORO_QNN_GPU_DEFAULT\n                || prefs.getBoolean(PREF_NNAPI_ENABLED, false);\n'''
          new = '''        boolean restoreAccelerator = isQnnGpuRequested(app)\n                || (!BuildConfig.KOKORO_QNN_GPU_DEFAULT && prefs.getBoolean(PREF_NNAPI_ENABLED, false));\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '            boolean requestedQnnGpu = BuildConfig.KOKORO_QNN_GPU_DEFAULT;\n'
          new = '            boolean requestedQnnGpu = isQnnGpuRequested(context);\n'
          assert old in s
          s = s.replace(old, new, 1)

          old = '''                            + ", provider=" + activeProviderLabel()\n                            + ", qnnGpuRequested=" + requestedQnnGpu\n'''
          new = '''                            + ", provider=" + activeProviderLabel()\n                            + ", requestedBackend=" + requestedRuntimeBackend(context)\n                            + ", qnnGpuRequested=" + requestedQnnGpu\n'''
          assert old in s
          s = s.replace(old, new, 1)
          engine_path.write_text(s)

          ui_path = Path('app/src/main/java/com/CodeBySonu/VoxSherpa/system/TtsDiagnosticsActivity.java')
          s = ui_path.read_text()

          old = 'import com.CodeBySonu.VoxSherpa.vietnamese.VietnameseKokoroEngine;\n'
          new = 'import com.CodeBySonu.VoxSherpa.BuildConfig;\nimport com.CodeBySonu.VoxSherpa.vietnamese.VietnameseKokoroEngine;\n'
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    private Button benchmark;\n    private Button nnapi;\n'''
          new = '''    private Button benchmark;\n    private Button nnapi;\n    private Button cpuBackend;\n    private Button gpuBackend;\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        root.addView(actions);\n\n        nnapi = new Button(this);\n'''
          new = '''        root.addView(actions);\n\n        if (BuildConfig.KOKORO_QNN_GPU_DEFAULT) {\n            TextView backendTitle = new TextView(this);\n            backendTitle.setText("Kokoro runtime A/B — same ORT 1.26.0, same model and voice");\n            backendTitle.setTextSize(16f);\n            backendTitle.setPadding(0, pad, 0, 0);\n            root.addView(backendTitle);\n\n            cpuBackend = new Button(this);\n            cpuBackend.setContentDescription(\n                    "Use CPU with ONNX Runtime 1.26.0. Switching rebuilds and warms the same Kokoro model for a fair comparison with QNN GPU.");\n            cpuBackend.setOnClickListener(v -> switchRuntimeBackend(VietnameseKokoroEngine.BACKEND_CPU));\n            root.addView(cpuBackend, new LinearLayout.LayoutParams(\n                    LinearLayout.LayoutParams.MATCH_PARENT,\n                    LinearLayout.LayoutParams.WRAP_CONTENT\n            ));\n\n            gpuBackend = new Button(this);\n            gpuBackend.setContentDescription(\n                    "Use Qualcomm QNN GPU with ONNX Runtime 1.26.0. Switching rebuilds and warms the same Kokoro model for a fair comparison with CPU.");\n            gpuBackend.setOnClickListener(v -> switchRuntimeBackend(VietnameseKokoroEngine.BACKEND_QNN_GPU));\n            root.addView(gpuBackend, new LinearLayout.LayoutParams(\n                    LinearLayout.LayoutParams.MATCH_PARENT,\n                    LinearLayout.LayoutParams.WRAP_CONTENT\n            ));\n        }\n\n        nnapi = new Button(this);\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        root.addView(nnapi, new LinearLayout.LayoutParams(\n                LinearLayout.LayoutParams.MATCH_PARENT,\n                LinearLayout.LayoutParams.WRAP_CONTENT\n        ));\n\n        benchmark = new Button(this);\n'''
          new = '''        root.addView(nnapi, new LinearLayout.LayoutParams(\n                LinearLayout.LayoutParams.MATCH_PARENT,\n                LinearLayout.LayoutParams.WRAP_CONTENT\n        ));\n        if (BuildConfig.KOKORO_QNN_GPU_DEFAULT) nnapi.setVisibility(android.view.View.GONE);\n\n        benchmark = new Button(this);\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        root.addView(benchmark, new LinearLayout.LayoutParams(\n                LinearLayout.LayoutParams.MATCH_PARENT,\n                LinearLayout.LayoutParams.WRAP_CONTENT\n        ));\n\n        output = new TextView(this);\n'''
          new = '''        root.addView(benchmark, new LinearLayout.LayoutParams(\n                LinearLayout.LayoutParams.MATCH_PARENT,\n                LinearLayout.LayoutParams.WRAP_CONTENT\n        ));\n        if (BuildConfig.KOKORO_QNN_GPU_DEFAULT) benchmark.setVisibility(android.view.View.GONE);\n\n        output = new TextView(this);\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        output.setText(snapshot + perf);\n        refreshProviderButton();\n    }\n\n    private void refreshProviderButton() {\n'''
          new = '''        output.setText(snapshot + perf);\n        refreshProviderButton();\n        refreshRuntimeButtons();\n    }\n\n    private void refreshRuntimeButtons() {\n        if (!BuildConfig.KOKORO_QNN_GPU_DEFAULT || cpuBackend == null || gpuBackend == null) return;\n        VietnameseKokoroEngine engine = VietnameseKokoroEngine.getInstance();\n        String requested = engine.requestedRuntimeBackend(this);\n        boolean gpuActive = engine.isQnnGpuActive();\n        boolean cpuRequested = VietnameseKokoroEngine.BACKEND_CPU.equals(requested);\n        cpuBackend.setText(cpuRequested\n                ? "CPU • ORT 1.26.0 — SELECTED"\n                : "CPU • ORT 1.26.0 — use this mode");\n        gpuBackend.setText(!cpuRequested\n                ? (gpuActive ? "QNN GPU • ORT 1.26.0 — SELECTED / ACTIVE"\n                        : "QNN GPU • ORT 1.26.0 — SELECTED / FALLBACK CPU")\n                : "QNN GPU • ORT 1.26.0 — use this mode");\n    }\n\n    private void switchRuntimeBackend(String backend) {\n        if (!BuildConfig.KOKORO_QNN_GPU_DEFAULT || cpuBackend == null || gpuBackend == null) return;\n        VietnameseKokoroEngine engine = VietnameseKokoroEngine.getInstance();\n        final boolean gpu = VietnameseKokoroEngine.BACKEND_QNN_GPU.equals(backend);\n        cpuBackend.setEnabled(false);\n        gpuBackend.setEnabled(false);\n        cpuBackend.setText(gpu ? "CPU • ORT 1.26.0" : "Switching to CPU…");\n        gpuBackend.setText(gpu ? "Switching to QNN GPU…" : "QNN GPU • ORT 1.26.0");\n        TtsDiagnostics.info(this, "provider", "ui_backend_requested",\n                "User requested runtime backend=" + backend + "; CPU threads reset to ORT default for controlled A/B.");\n\n        new Thread(() -> {\n            try {\n                String active = engine.setRuntimeBackend(this, backend);\n                runOnUiThread(() -> {\n                    cpuBackend.setEnabled(true);\n                    gpuBackend.setEnabled(true);\n                    refresh();\n                    String message;\n                    if (gpu && !"QNN_GPU".equals(active)) {\n                        message = "QNN GPU could not stay active; CPU fallback is active. See the log.";\n                    } else {\n                        message = "Runtime switched to " + active + " and warmed. You can test TalkBack now.";\n                    }\n                    Toast.makeText(this, message, Toast.LENGTH_LONG).show();\n                });\n            } catch (Throwable t) {\n                TtsDiagnostics.error(this, "provider", "ui_backend_switch_failed", t.toString(), t);\n                runOnUiThread(() -> {\n                    cpuBackend.setEnabled(true);\n                    gpuBackend.setEnabled(true);\n                    refresh();\n                    Toast.makeText(this, "Runtime switch failed. See TTS Logs.", Toast.LENGTH_LONG).show();\n                });\n            }\n        }, "KokoroVi-Runtime-Switch").start();\n    }\n\n    private void refreshProviderButton() {\n'''
          assert old in s
          s = s.replace(old, new, 1)
          ui_path.write_text(s)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/CodeBySonu/VoxSherpa/vietnamese/VietnameseKokoroEngine.java \
                  app/src/main/java/com/CodeBySonu/VoxSherpa/system/TtsDiagnosticsActivity.java
          git diff --cached --check
          git commit -m 'Apply dual ORT 1.26 runtime selector'
          git push origin HEAD:agent/qnn-gpu-experiment
