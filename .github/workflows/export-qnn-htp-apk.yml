name: Export signed QNN HTP APK in parts

on:
  push:
    branches: [agent/qnn-htp-experiment]
    paths:
      - .github/workflows/export-qnn-htp-apk.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      SOURCE_RUN_ID: '32353974283'
      SOURCE_ARTIFACT: 'VoxSherpa-Kokoro-ORT-1.26-QNN-HTP-AB'
      STOREPASS: 'VoxSherpaQnnHtpTest2026'
      ALIAS: 'voxsherpa-qnn-htp-test'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record export run id
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-state
          printf 'run_id=%s\nstatus=running-signed-export\n' "$GITHUB_RUN_ID" > .ci-state/qnn-htp-export-run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .ci-state/qnn-htp-export-run.txt
          git commit -m "Record signed QNN HTP export run $GITHUB_RUN_ID" || true
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push origin HEAD:"$GITHUB_REF_NAME"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Android SDK and signing tools
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'build-tools;35.0.0'
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Download verified A/B artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Zipalign and sign installable test APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find source -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          mkdir -p signed export
          keytool -genkeypair -v \
            -keystore signed/qnn-htp-test.jks \
            -storepass "$STOREPASS" -keypass "$STOREPASS" \
            -alias "$ALIAS" -keyalg RSA -keysize 3072 -validity 3650 \
            -dname 'CN=VoxSherpa QNN HTP Test,OU=Experimental,O=VoxSherpa,L=Test,ST=Test,C=VN'
          zipalign -f -p 4 "$APK" signed/VoxSherpa-4.1.4-QNN-HTP-AB-aligned.apk
          apksigner sign \
            --ks signed/qnn-htp-test.jks \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$STOREPASS" \
            --key-pass "pass:$STOREPASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out signed/VoxSherpa-4.1.4-QNN-HTP-AB-signed.apk \
            signed/VoxSherpa-4.1.4-QNN-HTP-AB-aligned.apk
          apksigner verify --verbose --print-certs signed/VoxSherpa-4.1.4-QNN-HTP-AB-signed.apk
          zipalign -c -p 4 signed/VoxSherpa-4.1.4-QNN-HTP-AB-signed.apk
          sha256sum signed/VoxSherpa-4.1.4-QNN-HTP-AB-signed.apk

      - name: Split signed APK into four parts
        shell: bash
        run: |
          set -euo pipefail
          APK=signed/VoxSherpa-4.1.4-QNN-HTP-AB-signed.apk
          python - "$APK" <<'PY'
          import hashlib, json, math, sys
          from pathlib import Path
          src = Path(sys.argv[1])
          data_size = src.stat().st_size
          parts = 4
          chunk = math.ceil(data_size / parts)
          sha = hashlib.sha256()
          part_meta = []
          with src.open('rb') as f:
              for i in range(parts):
                  payload = f.read(chunk)
                  if not payload:
                      raise SystemExit(f'missing payload for part {i}')
                  sha.update(payload)
                  p = Path('export') / f'VoxSherpa-4.1.4-QNN-HTP-AB-signed.apk.part{i:02d}'
                  p.write_bytes(payload)
                  part_meta.append({
                      'name': p.name,
                      'bytes': len(payload),
                      'sha256': hashlib.sha256(payload).hexdigest(),
                  })
              if f.read(1):
                  raise SystemExit('split did not consume the full APK')
          manifest = {
              'sourceRunId': 32353974283,
              'signed': True,
              'apkName': src.name,
              'apkBytes': data_size,
              'apkSha256': sha.hexdigest(),
              'parts': part_meta,
          }
          Path('export/manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload signed part 00
        uses: actions/upload-artifact@v4
        with:
          name: QNN-HTP-SIGNED-APK-part00
          path: export/VoxSherpa-4.1.4-QNN-HTP-AB-signed.apk.part00
          compression-level: 0
          retention-days: 7

      - name: Upload signed part 01
        uses: actions/upload-artifact@v4
        with:
          name: QNN-HTP-SIGNED-APK-part01
          path: export/VoxSherpa-4.1.4-QNN-HTP-AB-signed.apk.part01
          compression-level: 0
          retention-days: 7

      - name: Upload signed part 02
        uses: actions/upload-artifact@v4
        with:
          name: QNN-HTP-SIGNED-APK-part02
          path: export/VoxSherpa-4.1.4-QNN-HTP-AB-signed.apk.part02
          compression-level: 0
          retention-days: 7

      - name: Upload signed part 03 and manifest
        uses: actions/upload-artifact@v4
        with:
          name: QNN-HTP-SIGNED-APK-part03
          path: |
            export/VoxSherpa-4.1.4-QNN-HTP-AB-signed.apk.part03
            export/manifest.json
          compression-level: 0
          retention-days: 7
