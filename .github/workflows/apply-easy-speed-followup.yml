name: Apply Easy Speed Follow-up

on:
  push:
    branches:
      - agent/easy-speed-optimizations

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout optimization branch
        uses: actions/checkout@v4
        with:
          ref: agent/easy-speed-optimizations
          fetch-depth: 0

      - name: Apply follow-up source patch
        run: python3 scripts/apply_easy_speed_followup.py

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/CodeBySonu/VoxSherpa/vietnamese/VietnameseKokoroEngine.java \
                  app/src/main/cpp/kokoro_vi/kokoro_vi_jni.cpp \
                  app/src/main/java/com/CodeBySonu/VoxSherpa/system/TtsDiagnosticsActivity.java \
                  scripts/prepare_kokoro_vi_stage1.sh
          if git diff --cached --quiet; then
            echo "No source changes were needed."
            exit 0
          fi
          git commit -m "Tune warmup and lightweight CPU benchmark"
          git push origin HEAD:agent/easy-speed-optimizations
