name: Kokoro model-only aggressive optimization

on:
  workflow_dispatch:
  push:
    branches:
      - agent/selective-int8-experiment
    paths:
      - scripts/prepare_aggressive_kokoro_model.py
      - .github/workflows/kokoro-model-only-optimize.yml

permissions:
  contents: write

concurrency:
  group: kokoro-model-only-aggressive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  optimize-model:
    name: Produce drop-in optimized kokoro_vi.onnx
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install quantization dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.26.4' 'onnx==1.15.0' 'onnxruntime==1.17.1'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python - <<'PY'
          import numpy, onnx, onnxruntime
          print('numpy', numpy.__version__)
          print('onnx', onnx.__version__)
          print('onnxruntime', onnxruntime.__version__)
          PY

      - name: Download only the model and one real voicepack
        shell: bash
        run: |
          set -euo pipefail
          HF_REPO='contextboxai/Kokoro-Vietnamese'
          HF_REVISION='9f210d622209fcc216fe2ac6159fed2ff381cb8a'
          ASSET_DIR='app/src/main/assets/kokoro_vi'
          mkdir -p "$ASSET_DIR/voicepacks" build/model-only-source
          curl --fail --location --retry 4 --retry-delay 3 \
            -o "$ASSET_DIR/kokoro_vi.onnx" \
            "https://huggingface.co/${HF_REPO}/resolve/${HF_REVISION}/kokoro_vi.onnx?download=true"
          curl --fail --location --retry 4 --retry-delay 3 \
            -o build/model-only-source/diem_trinh.pt \
            "https://huggingface.co/${HF_REPO}/resolve/${HF_REVISION}/voicepacks/diem_trinh.pt?download=true"
          python tools/kokoro_vi/convert_voicepack.py \
            build/model-only-source/diem_trinh.pt \
            "$ASSET_DIR/voicepacks/diem_trinh.f32le"
          test "$(wc -c < "$ASSET_DIR/kokoro_vi.onnx")" -gt 300000000
          test "$(wc -c < "$ASSET_DIR/voicepacks/diem_trinh.f32le")" -eq 522240

      - name: Run aggressive mixed INT8 optimizer
        id: optimize
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .ci-state
          python scripts/prepare_aggressive_kokoro_model.py 2>&1 | tee .ci-state/aggressive-model-optimizer.log

      - name: Record optimizer report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-state
          if [[ -s build/model-only-output/optimization_report.json ]]; then
            cp build/model-only-output/optimization_report.json .ci-state/aggressive-model-report.json
          else
            python - <<'PY'
          import json
          from pathlib import Path
          log = Path('.ci-state/aggressive-model-optimizer.log')
          tail = log.read_text(errors='replace').splitlines()[-160:] if log.exists() else ['optimizer ended before a report was written']
          Path('.ci-state/aggressive-model-report.json').write_text(json.dumps({
              'status': 'failed_before_report',
              'logTail': tail,
          }, ensure_ascii=False, indent=2) + '\n')
          PY
          fi
          printf 'run_id=%s\nhead_sha=%s\noptimizer_outcome=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "${{ steps.optimize.outcome }}" > .ci-state/aggressive-model-run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .ci-state/aggressive-model-report.json .ci-state/aggressive-model-run.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record aggressive model optimization ${GITHUB_RUN_ID}"
            git push origin HEAD:agent/selective-int8-experiment
          fi

      - name: Verify accepted artifact
        if: steps.optimize.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test -s build/model-only-output/kokoro_vi.onnx
          test -s build/model-only-output/optimization_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('build/model-only-output/optimization_report.json').read_text())
          assert report['status'] == 'accepted_material_optimization', report['status']
          assert report['sizeReductionPercent'] >= 25.0, report['sizeReductionPercent']
          print('accepted size reduction:', report['sizeReductionPercent'])
          print('optimized bytes:', report['optimizedBytes'])
          print('sha256:', report['sha256'])
          PY

      - name: Upload optimized model only
        if: steps.optimize.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: VoxSherpa-Kokoro-Optimized-Model-Only
          path: |
            build/model-only-output/kokoro_vi.onnx
            build/model-only-output/optimization_report.json
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
