name: Kokoro Vietnamese Stage 1

on:
  workflow_dispatch:
  push:
    branches:
      - agent/kokoro-vietnamese-integration

permissions:
  contents: read

jobs:
  build-stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install voicepack conversion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Prepare Vietnamese model and native dependencies
        run: ./scripts/prepare_kokoro_vi_stage1.sh

      - name: Build Stage-1 release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon -x test -x lint

      - name: Upload Stage-1 APK
        uses: actions/upload-artifact@v4
        with:
          name: VoxSherpa-Kokoro-Vietnamese-Stage1
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: error
