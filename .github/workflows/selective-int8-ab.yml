name: Kokoro Vietnamese Selective INT8 A-B-C

on:
  workflow_dispatch:
  push:
    branches:
      - agent/selective-int8-experiment

permissions:
  contents: write

concurrency:
  group: kokoro-vi-selective-int8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-selective-int8:
    if: github.actor != 'github-actions[bot]'
    name: Build FP32 vs selective INT8 CPU APK
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record active run id
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-state
          printf 'run_id=%s\nhead_sha=%s\nstatus=running\nartifact=VoxSherpa-Kokoro-Vietnamese-SELECTIVE-INT8-ABC\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" > .ci-state/selective-int8-run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .ci-state/selective-int8-run.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record active selective INT8 run ${GITHUB_RUN_ID}"
            git push origin HEAD:agent/selective-int8-experiment
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==1.26.4' 'onnx==1.15.0' 'onnxruntime==1.17.1'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python - <<'PY'
          import numpy, onnx, onnxruntime
          print('numpy', numpy.__version__)
          print('onnx', onnx.__version__)
          print('onnxruntime', onnxruntime.__version__)
          PY

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust Android targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Prepare Kokoro and ORT 1.17.1 CPU runtime
        env:
          ORT_VERSION: '1.17.1'
        run: ./scripts/prepare_kokoro_vi_stage1.sh

      - name: Create selective dynamic INT8 model
        id: quantize
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .ci-state
          python3 ./scripts/prepare_selective_int8_model.py 2>&1 | tee .ci-state/selective-int8-quantizer.log

      - name: Record quantizer failure
        if: failure() && steps.quantize.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          tail -n 120 .ci-state/selective-int8-quantizer.log > .ci-state/selective-int8-quantizer-error.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .ci-state/selective-int8-quantizer-error.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record selective INT8 quantizer failure ${GITHUB_RUN_ID}"
            git push origin HEAD:agent/selective-int8-experiment
          fi

      - name: Record duration-safe quantization report
        if: steps.quantize.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cp app/src/main/assets/kokoro_vi/int8_quantization_report.json .ci-state/selective-int8-quantization-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .ci-state/selective-int8-quantization-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Record duration-safe selective INT8 report ${GITHUB_RUN_ID}"
            git push origin HEAD:agent/selective-int8-experiment
          fi

      - name: Harden integration patch anchors
        run: python3 ./scripts/fix_selective_int8_patch_anchors.py

      - name: Apply selective INT8 A-B-C experiment
        id: apply_patch
        shell: bash
        run: |
          set -o pipefail
          python3 ./scripts/apply_selective_int8_experiment.py 2>&1 | tee .ci-state/selective-int8-patch.log

      - name: Record integration patch failure
        if: failure() && steps.apply_patch.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          tail -n 120 .ci-state/selective-int8-patch.log > .ci-state/selective-int8-patch-error.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .ci-state/selective-int8-patch-error.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record selective INT8 integration failure ${GITHUB_RUN_ID}"
            git push origin HEAD:agent/selective-int8-experiment
          fi

      - name: Show quantization report
        run: cat app/src/main/assets/kokoro_vi/int8_quantization_report.json

      - name: Build selective INT8 APK
        env:
          VOX_VERSION_NAME: '4.1.6-selective-int8-abc'
          VOX_VERSION_CODE: '200202'
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -PkokoroViStage1=true --no-daemon -x test -x lint

      - name: Verify APK linkage and both models
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          rm -rf "$RUNNER_TEMP/int8-apk-check"
          mkdir -p "$RUNNER_TEMP/int8-apk-check"
          unzip -q "$APK" \
            'lib/arm64-v8a/libvoxsherpa_kokoro_vi.so' \
            'lib/arm64-v8a/libonnxruntime.so' \
            -d "$RUNNER_TEMP/int8-apk-check"
          NEEDED=$(readelf -d "$RUNNER_TEMP/int8-apk-check/lib/arm64-v8a/libvoxsherpa_kokoro_vi.so")
          echo "$NEEDED" | grep -F 'Shared library: [libsea_g2p_android.so]'
          echo "$NEEDED" | grep -F 'Shared library: [libonnxruntime.so]'
          unzip -l "$APK" | grep -F 'assets/kokoro_vi/kokoro_vi.onnx'
          unzip -l "$APK" | grep -F 'assets/kokoro_vi/kokoro_vi_int8.onnx'
          unzip -l "$APK" | grep -F 'assets/kokoro_vi/int8_quantization_report.json'
          unzip -l "$APK" | grep -F 'assets/kokoro_vi/sea_g2p.bin'
          strings "$RUNNER_TEMP/int8-apk-check/lib/arm64-v8a/libvoxsherpa_kokoro_vi.so" | grep -F 'Selective INT8 experiment session'
          voices=(diem_trinh hung_thinh mai_linh mai_loan manh_dung my_yen ngoc_huyen phat_tai thanh_dat thuc_trinh tuan_ngoc storyvert duc_an duc_duy)
          for voice in "${voices[@]}"; do
            unzip -l "$APK" | grep -F "assets/kokoro_vi/voicepacks/${voice}.f32le"
          done
          count=$(unzip -l "$APK" | grep -c 'assets/kokoro_vi/voicepacks/.*\.f32le')
          test "$count" -eq 14 || { echo "Expected 14 Vietnamese voicepacks, found $count" >&2; exit 1; }

      - name: Upload selective INT8 APK
        uses: actions/upload-artifact@v4
        with:
          name: VoxSherpa-Kokoro-Vietnamese-SELECTIVE-INT8-ABC
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Record successful run id
        shell: bash
        run: |
          set -euo pipefail
          printf 'run_id=%s\nhead_sha=%s\nstatus=success\nartifact=VoxSherpa-Kokoro-Vietnamese-SELECTIVE-INT8-ABC\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" > .ci-state/selective-int8-run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .ci-state/selective-int8-run.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record selective INT8 artifact run ${GITHUB_RUN_ID}"
            git push origin HEAD:agent/selective-int8-experiment
          fi
